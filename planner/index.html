<title>מרחב</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --surface-2:#EDF1F5;
    --surface-3:#E1E7EE;
    --ink:#0F1720;
    --ink-soft:#4A5663;
    --ink-faint:#8B97A5;
    --primary:#0E97AE;
    --primary-strong:#0A7E92;
    --primary-tint:rgba(14,151,174,.10);
    --sky:#1AA6BC;
    --sky-tint:rgba(26,166,188,.12);
    --accent:#0E97AE;
    --accent-tint:rgba(14,151,174,.10);
    --good:#2E9E5B;
    --good-tint:rgba(46,158,91,.12);
    --bad:#D64545;
    --bad-tint:rgba(214,69,69,.11);
    --warn:#C1841F;
    --warn-tint:rgba(193,132,31,.13);
    --grid:rgba(15,23,32,.08);
    --border:rgba(15,23,32,.10);
    --border-soft:rgba(15,23,32,.055);
    --shadow:0 1px 2px rgba(15,23,32,.04), 0 4px 14px rgba(15,23,32,.05);
    --shadow-lg:0 6px 18px rgba(15,23,32,.08), 0 18px 44px rgba(15,23,32,.10);
    --r:12px;
    --r-lg:16px;
    --nav-w:240px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0D1117;
      --surface:#151B23;
      --surface-2:#1B222C;
      --surface-3:#232C38;
      --ink:#E7EDF4;
      --ink-soft:#9AA6B4;
      --ink-faint:#66707E;
      --primary:#2AD3E6;
      --primary-strong:#15BACE;
      --primary-tint:rgba(42,211,230,.14);
      --sky:#22C3D6;
      --sky-tint:rgba(34,195,214,.15);
      --accent:#2AD3E6;
      --accent-tint:rgba(42,211,230,.14);
      --good:#3FB950;
      --good-tint:rgba(63,185,80,.16);
      --bad:#F85149;
      --bad-tint:rgba(248,81,73,.15);
      --warn:#D6A33A;
      --warn-tint:rgba(214,163,58,.16);
      --grid:rgba(255,255,255,.07);
      --border:rgba(255,255,255,.09);
      --border-soft:rgba(255,255,255,.05);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
      --shadow-lg:0 8px 24px rgba(0,0,0,.45), 0 20px 48px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1117;
    --surface:#151B23;
    --surface-2:#1B222C;
    --surface-3:#232C38;
    --ink:#E7EDF4;
    --ink-soft:#9AA6B4;
    --ink-faint:#66707E;
    --primary:#2AD3E6;
    --primary-strong:#15BACE;
    --primary-tint:rgba(42,211,230,.14);
    --sky:#22C3D6;
    --sky-tint:rgba(34,195,214,.15);
    --accent:#2AD3E6;
    --accent-tint:rgba(42,211,230,.14);
    --good:#3FB950;
    --good-tint:rgba(63,185,80,.16);
    --bad:#F85149;
    --bad-tint:rgba(248,81,73,.15);
    --warn:#D6A33A;
    --warn-tint:rgba(214,163,58,.16);
    --grid:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09);
    --border-soft:rgba(255,255,255,.05);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg:0 8px 24px rgba(0,0,0,.45), 0 20px 48px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;
    direction:rtl;line-height:1.5;-webkit-font-smoothing:antialiased;
    font-size:15px;
  }
  h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.015em}
  .serif{font-weight:600;letter-spacing:-.025em}
  .mono{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
  ::selection{background:var(--accent);color:#1B2540}
  :focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}

  /* ---------- shell ---------- */
  .app{display:flex;min-height:100%}
  .nav{
    width:var(--nav-w);flex-shrink:0;background:var(--surface);
    border-inline-start:1px solid var(--border);
    padding:22px 14px;display:flex;flex-direction:column;gap:4px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(150deg,var(--primary),var(--sky));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
    box-shadow:0 4px 12px var(--primary-tint);
  }
  .brand-name{font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand-sub{font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:-3px}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:10px 12px;border:none;background:none;border-radius:11px;
    font-size:15px;font-weight:500;color:var(--ink-soft);text-align:start;
    transition:background .12s,color .12s;
  }
  .nav-item .ic{width:20px;text-align:center;font-size:16px;flex-shrink:0}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:var(--shadow)}
  .nav-item.active .ic{filter:grayscale(0)}
  .nav-badge{margin-inline-start:auto;font-size:12px;font-weight:700;
    background:var(--bad);color:#fff;border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.25)}
  .nav-soon{margin-inline-start:auto;font-size:10px;color:var(--ink-faint);
    border:1px solid var(--border);border-radius:20px;padding:1px 7px}
  .nav-sep{height:1px;background:var(--border-soft);margin:10px 6px}
  .nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:none;align-items:center;gap:10px;padding:12px 16px;
    background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:30;
  }
  .content{flex:1;padding:28px 34px 90px;max-width:1180px;width:100%;margin:0 auto}

  /* ---------- generic ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
  .ring > span,.day-num,.kpi .ic+*{font-variant-numeric:tabular-nums}
  .greeting{font-size:30px;font-weight:700}
  .subtle{color:var(--ink-soft)}
  .muted{color:var(--ink-faint)}
  .row{display:flex;gap:10px;align-items:center}
  .wrap{flex-wrap:wrap}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    padding:5px 12px;border-radius:20px;white-space:normal;line-height:1.5}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);border-radius:11px;padding:9px 15px;
    font-weight:600;font-size:14px;transition:transform .1s,box-shadow .12s,background .12s}
  .btn:hover{box-shadow:var(--shadow)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
  .btn.primary:hover{background:var(--primary-strong)}
  .btn.ghost{background:none;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.icon{padding:8px;width:38px;height:38px;justify-content:center}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:16px 16px 14px;text-align:start;position:relative;overflow:hidden;
    transition:transform .12s,box-shadow .12s;box-shadow:var(--shadow)}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .kpi .num{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .kpi .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:8px}
  .kpi .ic{position:absolute;inset-inline-start:14px;top:14px;font-size:16px;opacity:.9;
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
  .kpi.k-today .num{color:var(--primary)} .kpi.k-today .ic{background:var(--primary-tint)}
  .kpi.k-over .num{color:var(--bad)} .kpi.k-over .ic{background:var(--bad-tint)}
  .kpi.k-open .num{color:var(--sky)} .kpi.k-open .ic{background:var(--sky-tint)}
  .kpi.k-done .num{color:var(--good)} .kpi.k-done .ic{background:var(--good-tint)}
  .kpi.k-wait .num{color:var(--warn)} .kpi.k-wait .ic{background:var(--warn-tint)}

  /* ---------- dashboard grid ---------- */
  .dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
  .section-title{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .section-title h2{font-size:20px}
  .section-title .count{font-size:13px;color:var(--ink-faint);font-weight:600}

  .panel{padding:20px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-head h3{font-size:16px}

  /* ---------- task item ---------- */
  .task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--r);
    border:1px solid var(--border-soft);background:var(--surface);transition:box-shadow .12s,border-color .12s;position:relative}
  .task+.task{margin-top:9px}
  .task:hover{box-shadow:var(--shadow);border-color:var(--border)}
  .task.done{opacity:.62}
  .task.done .task-title{text-decoration:line-through}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;
    background:none;display:grid;place-items:center;transition:.12s;padding:0}
  .check:hover{border-color:var(--good)}
  .check.on{background:var(--good);border-color:var(--good);color:#fff}
  .check.on::after{content:"✓";font-size:13px;font-weight:800}
  .task-body{flex:1;min-width:0}
  .task-title{font-weight:600;font-size:15px;word-break:break-word}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
  .chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;
    background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
  .chip.due{color:var(--ink-soft)}
  .chip.due.over{background:var(--bad-tint);color:var(--bad)}
  .chip.due.today{background:var(--warn-tint);color:var(--warn)}
  .prio-bar{position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px}
  .prio-high{background:var(--bad)} .prio-medium{background:var(--accent)} .prio-normal{background:var(--sky)}
  .task-actions{display:flex;gap:3px;opacity:0;transition:opacity .12s}
  .task:hover .task-actions,.task:focus-within .task-actions{opacity:1}
  .act{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--ink-faint);
    display:grid;place-items:center;font-size:14px}
  .act:hover{background:var(--surface-2);color:var(--ink)}
  .act.del:hover{background:var(--bad-tint);color:var(--bad)}

  .empty{text-align:center;padding:34px 20px;color:var(--ink-faint)}
  .empty .em-ic{font-size:30px;margin-bottom:8px;opacity:.8}

  /* ---------- mini widgets ---------- */
  .mini{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft)}
  .mini:last-child{border-bottom:none}
  .mini .mi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;background:var(--surface-2)}
  .progress{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-top:7px}
  .progress > span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--sky))}
  .habit-days{display:flex;gap:5px;margin-top:8px}
  .hd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;
    background:var(--surface-2);color:var(--ink-faint);border:none;padding:0;cursor:pointer;transition:.12s}
  button.hd:hover{background:var(--surface-3)}
  .hd.on{background:var(--good);color:#fff}
  .hd.today{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- toolbar / filters ---------- */
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;padding:8px 13px}
  .search input{border:none;background:none;outline:none;flex:1;width:100%}
  .segmented{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
  .segmented button{border:none;background:none;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
  .segmented button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* group headers in task list */
  .group-h{display:flex;align-items:center;gap:8px;margin:22px 2px 11px;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
  .group-h::after{content:"";flex:1;height:1px;background:var(--border-soft)}

  /* ---------- week ---------- */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  .day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-height:260px;display:flex;flex-direction:column;transition:background .12s,border-color .12s}
  .day.is-today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
  .day.drag-over{background:var(--sky-tint);border-color:var(--sky);border-style:dashed}
  .day-h{padding:11px 12px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:baseline}
  .day-name{font-weight:700;font-size:14px}
  .day.is-today .day-name{color:var(--primary)}
  .day-num{font-size:12px;color:var(--ink-faint);font-weight:600}
  .day-body{padding:9px;display:flex;flex-direction:column;gap:7px;flex:1}
  .wk-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:9px 10px;cursor:grab;font-size:13px;font-weight:600;position:relative}
  .wk-card:active{cursor:grabbing}
  .wk-card.dragging{opacity:.4}
  .wk-card .wk-meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .wk-card.done{opacity:.55;text-decoration:line-through}
  .wk-card .wbar{position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px}

  /* ---------- inbox ---------- */
  .inbox-add{display:flex;gap:10px;margin-bottom:20px}
  .inbox-add input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 15px;outline:none}
  .inbox-item{display:flex;gap:13px;align-items:flex-start;padding:15px 16px}
  .inbox-item+.inbox-item{border-top:1px solid var(--border-soft)}
  .ib-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--surface-2)}
  .ib-body{flex:1;min-width:0}
  .ib-text{font-weight:500}
  .ib-src{font-size:12px;color:var(--ink-faint);margin-top:3px}
  .ib-acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .tagbtn{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft)}
  .tagbtn:hover{color:var(--ink);border-color:var(--ink-soft)}
  .tagbtn.task:hover{background:var(--primary-tint);color:var(--primary);border-color:var(--primary)}
  .tagbtn.idea:hover{background:var(--accent);color:#1B2540}

  /* ---------- modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(20,26,40,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px;overflow:auto}
  .modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:540px;
    border:1px solid var(--border);max-height:92vh;overflow:auto;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-h h3{font-size:18px}
  .modal-b{padding:20px 22px}
  .nlp-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 15px;outline:none;resize:none;font-weight:500}
  .nlp-input:focus{border-color:var(--sky)}
  .nlp-hint{font-size:12.5px;color:var(--ink-faint);margin:8px 2px 2px}
  .field{margin-top:15px}
  .field > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chips-in{display:flex;gap:7px;flex-wrap:wrap}
  .chips-in button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink-soft)}
  .chips-in button.on{background:var(--primary);color:#fff;border-color:transparent}
  .chips-in button.on.p-high{background:var(--bad)} .chips-in button.on.p-medium{background:var(--accent);color:#1B2540} .chips-in button.on.p-normal{background:var(--sky)}
  .modal-f{display:flex;gap:10px;justify-content:flex-start;padding:16px 22px;border-top:1px solid var(--border-soft);position:sticky;bottom:0;background:var(--surface)}

  /* FAB */
  .fab{position:fixed;inset-block-end:22px;inset-inline-start:22px;z-index:40;
    background:var(--primary);color:#fff;border:none;border-radius:16px;padding:14px 20px;font-weight:700;font-size:15px;
    box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px}

  .soon-wrap{display:grid;place-items:center;text-align:center;padding:60px 20px}
  .soon-badge{font-size:12px;font-weight:700;color:var(--sky);background:var(--sky-tint);padding:5px 13px;border-radius:20px;margin-bottom:16px}
  .soon-wrap h2{font-size:26px;margin-bottom:8px}
  .soon-wrap p{color:var(--ink-soft);max-width:400px}

  /* ---------- assistant ---------- */
  .ai-banner{display:flex;align-items:center;gap:12px;width:100%;text-align:start;margin-bottom:18px;
    padding:13px 16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent-tint);
    color:var(--ink);transition:box-shadow .12s}
  .ai-banner:hover{box-shadow:var(--shadow)}
  .ai-banner .aib-ic{font-size:20px;flex-shrink:0}
  .ai-banner .aib-tx{font-weight:600;font-size:14px;flex:1;min-width:0}
  .ai-banner .aib-cta{font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap;flex-shrink:0}
  .insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .insight{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:var(--r);min-width:0;
    background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
  .insight .ins-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--surface-2)}

<script>
/* ============================================================
   מרחב — Life Planner (core preview)
   מקור נתונים מרכזי אחד: state.tasks / state.inbox
   כל התצוגות קוראות/כותבות לאותו state. שינוי בכל מקום -> save() -> render()
   ============================================================ */

const STORE_KEY = 'merhav.v1';
const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

const AREAS = {
  work:    {label:'עבודה',  color:'#6E8BB0', ic:'💼'},
  family:  {label:'משפחה',  color:'#6FA890', ic:'🏡'},
  health:  {label:'בריאות', color:'#C98A8A', ic:'💪'},
  personal:{label:'אישי',   color:'#C7A96B', ic:'🌱'},
  study:   {label:'לימודים',color:'#8C9AC4', ic:'📚'},
};
const STATUSES = {
  todo:       {label:'לביצוע', color:'var(--sky)'},
  'in-progress':{label:'בתהליך', color:'var(--warn)'},
  waiting:    {label:'ממתין',  color:'var(--ink-faint)'},
  done:       {label:'בוצע',   color:'var(--good)'},
  cancelled:  {label:'בוטל',   color:'var(--ink-faint)'},
};
const PRIOS = {
  high:  {label:'גבוהה',  cls:'p-high'},
  medium:{label:'בינונית',cls:'p-medium'},
  normal:{label:'רגילה',  cls:'p-normal'},
};

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function todayISO(){ return iso(today()); }
function addDays(dISO, n){ const d=new Date(dISO+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function parseISO(s){ return s? new Date(s+'T00:00:00') : null; }
function fmtDue(dISO){
  if(!dISO) return '';
  const t=todayISO();
  if(dISO===t) return 'היום';
  if(dISO===addDays(t,1)) return 'מחר';
  if(dISO===addDays(t,-1)) return 'אתמול';
  const d=parseISO(dISO);
  const diff=Math.round((d-today())/86400000);
  if(diff>1 && diff<7) return DAY_NAMES[d.getDay()];
  return d.toLocaleDateString('he-IL',{day:'numeric',month:'short'});
}
function dueState(dISO){
  if(!dISO) return '';
  const t=todayISO();
  if(dISO<t) return 'over';
  if(dISO===t) return 'today';
  return '';
}
function longDate(){
  return new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
}
function greetWord(){
  const h=new Date().getHours();
  if(h<5) return 'לילה טוב';
  if(h<12) return 'בוקר טוב';
  if(h<17) return 'צהריים טובים';
  if(h<21) return 'ערב טוב';
  return 'לילה טוב';
}

/* ---------- state ---------- */
let seq = 1000;
let state = load();
seq = state._seq || seq;
// migrate older saved state so new modules never hit undefined
state.tasks = state.tasks || [];
state.inbox = state.inbox || [];
state.goals = state.goals || [];
state.projects = state.projects || [];
state.habits = state.habits || [];
state.reviews = state.reviews || {};
state.botLog = state.botLog || [{from:'bot',text:'היי 👋 אני המוח של בוט הוואטסאפ. נסה: "תוסיף לדבר עם כפיר מחר ב-10", "סיימתי את המשימה עם דין", "מה בוצע היום?", "כמה סיימתי השבוע?"'}];
state.aiLog = state.aiLog || [{from:'bot',text:'אני העוזר שלך. שאל אותי: "מה הכי חשוב היום?", "מה אני דוחה?", "מה תקוע?", "איפה אני מעמיס?" או "תכנן לי מחר".'}];
// if this is the example dataset from an earlier version, backfill the demo modules
if(state._example && state.goals.length===0){
  const s=seed(); state.goals=s.goals; state.projects=s.projects; save();
}
if(state._example && state.habits.length===0){
  state.habits=seed().habits; save();
}
// backfill historical completed tasks so analytics charts have real history
if(state._example && !state._histSeeded){
  const seen=new Set(state.tasks.map(x=>x.title+'|'+x.completedAt));
  seed().tasks.filter(x=>x.completedAt && x.created && x.created<todayISO() && x.title!=='אימון בוקר' && !x.title.startsWith('סקירה שבועית'))
    .forEach(x=>{ if(!seen.has(x.title+'|'+x.completedAt)) state.tasks.push(x); });
  state._histSeeded=true; save();
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seed();
}
function save(){
  state._seq = seq;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function newId(){ seq++; return 'T-'+seq; }

function seed(){
  const t = todayISO();
  const mk = (o)=>Object.assign({
    id:'T-'+(++seq), title:'', desc:'', area:'personal', project:'',
    created:t, due:'', time:'', prio:'normal', status:'todo', progress:0,
    source:'manual', notes:'', assignee:'', tags:[], recurring:false, freq:'',
    completedAt:'', nextAction:'', waitingFor:false, followUp:'', deferCount:0
  }, o);
  const hlog = (...offs)=>offs.map(o=>addDays(t,o));
  const histTitles=['סגירת דוח שבועי','שיחה עם ספק','אימון כושר','קריאת חומר מקצועי','תיאום פגישה','סידור הבית','הכנת מצגת','מענה למיילים','תשלום חשבונות','תכנון תפריט','פגישת צוות','ריצת בוקר','קניות שבועיות','עדכון הלוח','סיכום קורס','זמן איכות עם המשפחה','בדיקת הצעות מחיר','שיחת מעקב'];
  const histAreas=['work','work','health','study','work','family','work','work','personal','family','work','health','family','personal','study','family','work','work'];
  const hist = histTitles.map((title,i)=>{
    const d=addDays(t, -(2 + i*3));
    return mk({title, area:histAreas[i], due:d, prio:'normal', status:'done', completedAt:d, created:addDays(d,-2)});
  });
  return {
    _seq:seq,
    _example:true,
    tasks:[
      mk({title:'לדבר עם דין לגבי השילוט של הצהרון', area:'work', project:'גיוס לצהרון', due:t, time:'10:00', prio:'high', status:'todo'}),
      mk({title:'לסיים את מצגת ההורים', area:'work', project:'גיוס לצהרון', due:addDays(t,-2), prio:'high', status:'in-progress', progress:60}),
      mk({title:'להזמין ציוד לאימון של חמישי', area:'health', due:addDays(t,-1), prio:'medium', status:'todo'}),
      mk({title:'לקבוע תור לרופא שיניים', area:'personal', due:t, prio:'normal', status:'todo'}),
      mk({title:'מחכה להצעת מחיר מהמדפיס', area:'work', project:'גיוס לצהרון', prio:'medium', status:'waiting', waitingFor:true, followUp:addDays(t,1), assignee:'המדפיס'}),
      mk({title:'לאשר את התקציב מול העירייה', area:'work', prio:'high', status:'waiting', waitingFor:true, followUp:addDays(t,-1), assignee:'העירייה'}),
      mk({title:'לתכנן את האימון של יום שני', area:'health', due:addDays(t,3), time:'08:00', prio:'normal', status:'todo'}),
      mk({title:'לענות לכפיר לגבי הפגישה', area:'work', due:addDays(t,2), prio:'medium', status:'todo'}),
      mk({title:'לקנות מתנה ליום הולדת', area:'family', due:addDays(t,4), prio:'normal', status:'todo'}),
      mk({title:'סקירה שבועית — לעבור על השבוע', area:'personal', due:addDays(t,-3), prio:'normal', status:'done', completedAt:addDays(t,-3), recurring:true, freq:'weekly'}),
      mk({title:'לשלוח סיכום פגישה לצוות', area:'work', due:t, prio:'medium', status:'done', completedAt:t}),
      mk({title:'אימון בוקר', area:'health', due:t, time:'06:30', prio:'normal', status:'done', completedAt:t, recurring:true, freq:'daily'}),
      ...hist,
    ],
    inbox:[
      {id:'I-1', text:'רעיון: יום שיא לגיוס בבתי הספר עם דוכנים', source:'רעיון', at:t, kind:'idea'},
      {id:'I-2', text:'לבדוק אם אפשר לקבל חסות מהעסק של רונית', source:'WhatsApp', at:t, kind:'note'},
      {id:'I-3', text:'להכין רשימת ציוד למחנה קיץ', source:'מחשבה', at:addDays(t,-1), kind:'note'},

/* ---------- projects & goals queries ---------- */
const LEVELS={year:'שנתי',quarter:'רבעוני',month:'חודשי'};
function projectStats(p){
  const ts=state.tasks.filter(t=>t.project===p.name && t.status!=='cancelled');
  const done=ts.filter(t=>t.status==='done').length;
  const overdue=ts.filter(t=>active(t)&&t.due&&t.due<todayISO()).length;
  const open=ts.filter(t=>active(t)).length;
  return {total:ts.length, done, open, overdue, pct: ts.length? Math.round(done/ts.length*100):0};
}
function goalChildren(g){ return (state.goals||[]).filter(x=>x.parent===g.id); }
function goalProjects(g){ return (state.projects||[]).filter(p=>p.goal===g.id); }
function goalProgress(g){
  if(g.target>0) return Math.min(100, Math.round((g.current/g.target)*100));
  const kids=goalChildren(g);
  if(kids.length) return Math.round(kids.reduce((s,k)=>s+goalProgress(k),0)/kids.length);
  const prs=goalProjects(g);
  if(prs.length) return Math.round(prs.reduce((s,p)=>s+projectStats(p).pct,0)/prs.length);
  return 0;
}
function projectsMissingAction(){ return (state.projects||[]).filter(p=>p.status==='active' && !p.nextAction); }

/* ---------- habits ---------- */
function habitStats(h){
  const log=new Set(h.log||[]); const t=todayISO();
  let streak=0, d=t;
  if(!log.has(t)) d=addDays(t,-1); // today not yet marked shouldn't break yesterday's streak
  while(log.has(d)){ streak++; d=addDays(d,-1); }
  const dates=[...log].sort(); let best=0,run=0,prev=null;
  for(const ds of dates){ run = (prev && ds===addDays(prev,1))? run+1 : 1; best=Math.max(best,run); prev=ds; }
  const first=addDays(t,-parseISO(t).getDay());
  let week=0; for(let i=0;i<7;i++){ if(log.has(addDays(first,i))) week++; }
  const month=dates.filter(ds=>ds.slice(0,7)===t.slice(0,7)).length;
  return {streak,best,week,month};
}
function toggleHabit(id,dateISO){
  const h=(state.habits||[]).find(x=>x.id===id); if(!h) return;
  h.log=h.log||[];
  const i=h.log.indexOf(dateISO);
  if(i>=0) h.log.splice(i,1); else h.log.push(dateISO);
  save(); render();
}

/* ---------- task queries (single source of truth) ---------- */
const active = t => t.status!=='done' && t.status!=='cancelled';
const isWaiting = t => t.waitingFor || t.status==='waiting';
function qToday(){ const d=todayISO(); return state.tasks.filter(t=>active(t)&&!isWaiting(t)&&t.due===d); }
function qOverdue(){ const d=todayISO(); return state.tasks.filter(t=>active(t)&&!isWaiting(t)&&t.due&&t.due<d); }
function qOpen(){ return state.tasks.filter(t=>active(t)&&!isWaiting(t)); }
function qDoneToday(){ const d=todayISO(); return state.tasks.filter(t=>t.status==='done'&&t.completedAt===d); }
function qWaiting(){ return state.tasks.filter(t=>active(t)&&isWaiting(t)); }
function focusTasks(){
  const rank={high:0,medium:1,normal:2};
  return [...qOverdue(),...qToday()]
    .filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i)
    .sort((a,b)=> rank[a.prio]-rank[b.prio] || (a.due||'').localeCompare(b.due||''))
    .slice(0,5);
}

/* ---------- mutations ---------- */
function toggleDone(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  if(t.status==='done'){ t.status='todo'; t.completedAt=''; t.progress=0; }
  else{ t.status='done'; t.completedAt=todayISO(); t.progress=100; t.waitingFor=false; toast('✓ בוצע'); }
  save(); render();
}
function snooze(id, dISO){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  t.due=dISO; t.deferCount=(t.deferCount||0)+1; if(t.status==='waiting'){t.status='todo';t.waitingFor=false;}
  save(); render(); toast('נדחתה ל'+fmtDue(dISO));
}
function setWaiting(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  t.status='waiting'; t.waitingFor=true; t.followUp=t.followUp||addDays(todayISO(),3);
  save(); render(); toast('הועבר ל"מחכה לאחרים"');
}
function delTask(id){
  state.tasks=state.tasks.filter(x=>x.id!==id); save(); render(); toast('נמחקה');
}

/* ---------- WEEK ---------- */
function viewWeek(){
  const t=todayISO();
  const first = addDays(t, -parseISO(t).getDay()); // back to Sunday
  const days=[...Array(7)].map((_,i)=>addDays(first,i));
  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">תכנון שבועי</div>
        <h1 class="greeting serif">השבוע שלי</h1>
        <p class="subtle" style="margin:6px 0 0">גרור משימה בין ימים כדי לשנות את תאריך היעד. ראשון מימין, שבת משמאל.</p>
      </div>
      <button class="btn primary" onclick="openQuickAdd()">＋ משימה</button>
    </div>
    <div class="week" id="weekGrid">
      ${days.map(d=>{
        const dd=parseISO(d);
        const items=state.tasks.filter(x=>x.due===d && x.status!=='cancelled');
        return `
        <div class="day ${d===t?'is-today':''}" data-date="${d}" ondragover="wkOver(event)" ondragleave="wkLeave(event)" ondrop="wkDrop(event,'${d}')">
          <div class="day-h">
            <span class="day-name">${DAY_NAMES[dd.getDay()]}</span>
            <span class="day-num">${dd.getDate()}/${dd.getMonth()+1}</span>
          </div>
          <div class="day-body">
            ${items.map(t2=>{
              const a=AREAS[t2.area]||{};
              return `<div class="wk-card ${t2.status==='done'?'done':''}" draggable="true" data-id="${t2.id}"
                        ondragstart="wkStart(event,'${t2.id}')" ondragend="wkEnd(event)" onclick="openEdit('${t2.id}')">
                <div class="wbar prio-${t2.prio}"></div>
                ${esc(t2.title)}
                <div class="wk-meta">
                  ${a.label?`<span class="chip" style="font-size:10.5px;padding:1px 6px"><span class="dot" style="background:${a.color}"></span>${a.label}</span>`:''}
                  ${t2.time?`<span class="chip" style="font-size:10.5px;padding:1px 6px">🕐 ${t2.time}</span>`:''}
                </div>
              </div>`;
            }).join('') || `<div class="muted" style="font-size:12px;text-align:center;padding:14px 0;opacity:.6">—</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
let dragId=null;
function wkStart(e,id){ dragId=id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function wkEnd(e){ e.currentTarget.classList.remove('dragging'); dragId=null; }
function wkOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function wkLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function wkDrop(e,d){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragId) return;
  const t=state.tasks.find(x=>x.id===dragId); if(t){ t.due=d; if(t.status==='waiting'){t.status='todo';t.waitingFor=false;} save(); render(); toast('הועברה ל'+fmtDue(d)); }
}

function saveGoal(id){
  const v=i=>document.getElementById(i).value;

    due:v('g_due'), current:+v('g_current')||0, target:+v('g_target')||0, why:v('g_why').trim()};

function delGoal(id){
  (state.goals||[]).forEach(x=>{ if(x.parent===id) x.parent=''; });

  state.goals=state.goals.filter(x=>x.id!==id); save(); closeModal(); render(); toast('המטרה נמחקה');
}

function saveHabit(id){

/* ---------- ANALYTICS ---------- */
function lastNWeeks(n){ const t=todayISO(); const cur=addDays(t,-parseISO(t).getDay()); return [...Array(n)].map((_,i)=>addDays(cur,-(n-1-i)*7)); }
function svgBars(series){
  const w=460,h=180,padT=22,padB=28,padX=6;
  const n=series.length, iw=w-padX*2, ih=h-padT-padB;
  const max=Math.max(1,...series.map(s=>s.value));
  const bw=iw/n, barw=Math.min(26,bw*0.5);
  const base=padT+ih;
  const grid=[0,.5,1].map(f=>{const y=padT+ih*(1-f);return `<line x1="${padX}" y1="${y}" x2="${w-padX}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${w-padX}" y="${y-3}" text-anchor="end" class="cgl">${Math.round(max*f)}</text>`;}).join('');
  const bars=series.map((s,i)=>{
    const cx=padX+bw*i+bw/2, bh=ih*(s.value/max), yy=base-bh;
    return `<g><rect x="${cx-barw/2}" y="${yy}" width="${barw}" height="${Math.max(bh,1)}" rx="4" fill="var(--accent)" class="cbar" data-tip="${esc(s.tip)}"></rect>
      ${s.value?`<text x="${cx}" y="${yy-5}" text-anchor="middle" class="cval">${s.value}</text>`:''}
      <text x="${cx}" y="${h-9}" text-anchor="middle" class="clbl">${s.label}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="direction:ltr;display:block" role="img" aria-label="throughput">${grid}${bars}</svg>`;
}
function hbars(rows){
  const max=Math.max(1,...rows.map(r=>r.value));
  return `<div class="hbars">${rows.map(r=>`
    <div class="hbar-row" data-tip="${esc(r.label)}: ${r.value}">
      <span class="hbar-label">${esc(r.label)}</span>
      <div class="hbar-track"><span class="hbar-fill" style="width:${Math.max(3,Math.round(r.value/max*100))}%"></span></div>
      <span class="hbar-val mono">${r.value}</span>
    </div>`).join('')}</div>`;
}
function viewAnalytics(){

  const done30=done.filter(x=>x.completedAt&&x.completedAt>=addDays(t,-30)).length;

  const onTimePct=withDue.length?Math.round(withDue.filter(x=>x.completedAt<=x.due).length/withDue.length*100):0;
  const compRate=notCancelled.length?Math.round(done.length/notCancelled.length*100):0;

  const areaLoad=Object.keys(AREAS).map(k=>({label:AREAS[k].ic+' '+AREAS[k].label,value:qOpen().filter(x=>x.area===k).length})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
  const areaDone=Object.keys(AREAS).map(k=>({label:AREAS[k].ic+' '+AREAS[k].label,value:done.filter(x=>x.area===k).length})).filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
  const split=[['todo','var(--sky)'],['in-progress','var(--warn)'],['waiting','var(--ink-faint)'],['done','var(--good)']].map(([s,c])=>({label:STATUSES[s].label,value:state.tasks.filter(x=>x.status===s).length,color:c}));
  const splitTotal=split.reduce((a,b)=>a+b.value,0)||1;
  const habAvg=(state.habits||[]).length?Math.round(state.habits.reduce((s,h)=>s+Math.min(100,habitStats(h).week/(h.target||7)*100),0)/state.habits.length):0;
  const bestWeek=Math.max(0,...weeks.map(w=>w.value));
  const stat=(n,l,sub,c)=>`<div class="kpi" style="cursor:default"><div class="num" style="color:${c||'var(--ink)'}">${n}</div><div class="lbl">${l}</div>${sub?`<div class="muted" style="font-size:11px;margin-top:2px">${sub}</div>`:''}</div>`;
  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">Performance</div>
        <h1 class="greeting serif">ביצועים</h1>
        <p class="subtle" style="margin:6px 0 0">איך אתה בפועל מבצע — לא מה שאתה מתכנן.</p>

    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:22px">
      ${stat(compRate+'%','אחוז השלמה כולל','','var(--accent)')}
      ${stat(done30,'הושלמו ב-30 יום','','var(--good)')}
      ${stat(onTimePct+'%','הושלמו בזמן','',onTimePct>=70?'var(--good)':'var(--warn)')}
      ${stat(overdue,'באיחור עכשיו','',overdue?'var(--bad)':'var(--good)')}
    </div>
    <div class="charts-grid">
      <div class="card chart-card" style="grid-column:1/-1">
        <div class="chart-h"><h3 class="serif">קצב ביצוע — 8 שבועות</h3><span class="muted mono" style="font-size:12px">שיא ${bestWeek}/שבוע</span></div>
        ${svgBars(weeks)}
      </div>
      <div class="card chart-card">
        <div class="chart-h"><h3 class="serif">עומס נוכחי לפי תחום</h3><span class="muted" style="font-size:12px">משימות פתוחות</span></div>
        ${areaLoad.length?hbars(areaLoad):emptyState('✅','אין עומס פתוח','')}
      </div>
      <div class="card chart-card">
        <div class="chart-h"><h3 class="serif">הושלמו לפי תחום</h3><span class="muted" style="font-size:12px">מצטבר</span></div>
        ${areaDone.length?hbars(areaDone):emptyState('—','אין נתונים','')}
      </div>
      <div class="card chart-card" style="grid-column:1/-1">
        <div class="chart-h"><h3 class="serif">פילוח סטטוס</h3><span class="muted mono" style="font-size:12px">${splitTotal} משימות</span></div>
        <div class="stackbar">${split.map(s=>s.value?`<span style="width:${s.value/splitTotal*100}%;background:${s.color}" data-tip="${s.label}: ${s.value} (${Math.round(s.value/splitTotal*100)}%)"></span>`:'').join('')}</div>
        <div class="legend">${split.map(s=>`<span class="lg"><span class="lg-sw" style="background:${s.color}"></span>${s.label} <b class="mono">${s.value}</b></span>`).join('')}</div>
      </div>
      <div class="card chart-card">
        <div class="chart-h"><h3 class="serif">התקדמות מטרות</h3></div>
        ${(state.goals||[]).filter(g=>!g.parent).map(g=>{const p=goalProgress(g);return `<div class="hbar-row"><span class="hbar-label">${esc(g.title)}</span><div class="hbar-track"><span class="hbar-fill" style="width:${Math.max(3,p)}%"></span></div><span class="hbar-val mono">${p}%</span></div>`;}).join('')||emptyState('🎯','אין מטרות','')}
      </div>
      <div class="card chart-card">
        <div class="chart-h"><h3 class="serif">עקביות הרגלים</h3><span class="muted mono" style="font-size:12px">${habAvg}% ממוצע</span></div>
        ${(state.habits||[]).map(h=>{const s=habitStats(h);const p=Math.min(100,Math.round(s.week/(h.target||7)*100));return `<div class="hbar-row"><span class="hbar-label">${h.ic||''} ${esc(h.name)}</span><div class="hbar-track"><span class="hbar-fill" style="width:${Math.max(3,p)}%;background:var(--good)"></span></div><span class="hbar-val mono">${s.week}/${h.target}</span></div>`;}).join('')||emptyState('🔥','אין הרגלים','')}

      </div>
      <div class="chat-input">
        <input id="botInput" placeholder="כתוב הודעה לבוט..." onkeydown="if(event.key==='Enter')botSend()">

function botQuick(text){ const i=document.getElementById('botInput'); if(i){i.value=text; botSend();} }
function botSend(){
  const i=document.getElementById('botInput'); if(!i) return;
  const text=i.value.trim(); if(!text) return;
  state.botLog.push({from:'user',text});
  const reply=botReply(text);
  state.botLog.push({from:'bot',text:reply});
  if(state.botLog.length>60) state.botLog=state.botLog.slice(-60);
  save();
  document.getElementById('content').innerHTML=viewBot();
  attachViewEvents('bot');
}
function doneThisWeek(){ const t=todayISO(); const first=addDays(t,-parseISO(t).getDay()); return state.tasks.filter(x=>x.status==='done'&&x.completedAt&&x.completedAt>=first&&x.completedAt<=addDays(first,6)); }
function botListReply(label,arr){
  if(!arr.length) return `אין משימות ${label}. 🎉`;
  return `${label} (${arr.length}):\n`+arr.map(x=>`• ${x.title}${x.time?' · '+x.time:''}${x.assignee?' · '+x.assignee:''}`).join('\n');
}
function botAskWhich(cand){
  return 'מצאתי כמה משימות שמתאימות — לאיזו התכוונת?\n'+cand.slice(0,5).map(t=>`• ${t.id}: ${t.title}`).join('\n')+'\n(שלח שוב עם מספר המשימה, למשל "'+cand[0].id.replace('T-','')+'")';
}
function botFindTasks(text){
  const idm=text.match(/\b[tT]?-?(\d{2,4})\b/);
  if(idm){ const num=idm[1]; const byId=state.tasks.filter(t=>t.id.replace(/\D/g,'').endsWith(num)); if(byId.length) return byId; }

  const words=text.split(/[\s,.]+/).filter(w=>w.length>=3 && !stop.has(w) && !/^\d+$/.test(w));

}
function botReply(raw){
  const text=raw.trim(); const t=todayISO();
  if(/^(עזרה|help|מה אתה יודע|מה אפשר)/.test(text))
    return 'אני יודע:\n• להוסיף משימה ("תוסיף...")\n• לסמן בוצע ("סיימתי...")\n• להעביר תאריך ("תעביר את 184 לחמישי")\n• לענות: מה יש היום/מחר/באיחור/מה מחכה\n• כמה/מה בוצע היום או השבוע\n• לשמור רעיון ל-Inbox';

  // how many done
  if(/כמה.*(בוצע|סיימתי|עשיתי|הושלמ)/.test(text)){
    const wk=/שבוע/.test(text); const arr=wk?doneThisWeek():qDoneToday();
    return `${wk?'השבוע':'היום'} סיימת ${arr.length} משימות${arr.length?':\n'+arr.map(x=>'✓ '+x.title).join('\n'):'.'}`;
  }
  // what done
  if(/מה.*(בוצע|סיימתי|עשיתי|הושלמ)/.test(text)){
    const wk=/שבוע/.test(text); const arr=wk?doneThisWeek():qDoneToday();
    if(!arr.length) return wk?'עוד לא סימנת משהו כבוצע השבוע.':'עוד לא סימנת משימה כבוצעה היום.';
    return `${wk?'בוצעו השבוע':'בוצעו היום'} (${arr.length}):\n`+arr.map(x=>'✓ '+x.title).join('\n');
  }
  // queries
  if(/מה.*מחר/.test(text)) return botListReply('מחר',state.tasks.filter(x=>active(x)&&x.due===addDays(t,1)));
  if(/מה.*(היום|יש לי היום)/.test(text)) return botListReply('היום',qToday());
  if(/מה.*(איחור|באיחור)/.test(text)) return botListReply('באיחור',qOverdue());
  if(/מחכה/.test(text)){
    const m=text.match(/מחכה\s+ל([֐-׿]{2,})/); let arr=qWaiting();
    if(m) arr=arr.filter(x=>(x.assignee||'').includes(m[1])||x.title.includes(m[1]));
    return botListReply('מחכה'+(m?' ל'+m[1]:' לאחרים'),arr);
  }
  // idea
  if(/^(יש לי רעיון|רעיון[:]?)/.test(text)){
    const idea=text.replace(/^(יש לי רעיון|רעיון[:]?)\s*/,'')||text;
    state.inbox.unshift({id:'I-'+Date.now(),text:idea,source:'WhatsApp',at:t,kind:'idea'}); save();
    return '💡 זיהיתי שזה רעיון — שמרתי ב-Inbox (לא כמשימה). תוכל להפוך אותו למשימה מתי שתרצה.';
  }
  // complete
  if(/^(סיימתי|בוצע|גמרתי|עשיתי|סיים|ביצעתי)/.test(text)){
    const cand=botFindTasks(text).filter(active);
    if(!cand.length) return 'לא מצאתי משימה פתוחה שמתאימה. ציין שם או מספר, למשל "סיימתי 184".';
    if(cand.length>1) return botAskWhich(cand);
    const k=cand[0]; k.status='done'; k.completedAt=t; k.progress=100; k.waitingFor=false; save();
    return `✓ סימנתי כבוצע: "${k.title}" (${k.id}).\nהיום בוצעו ${qDoneToday().length} משימות.`;
  }
  // move
  if(/^(תעביר|תדחה|תשנה|העבר|דחה)/.test(text)){
    const cand=botFindTasks(text).filter(active);
    const when=parseNL(text);
    if(!cand.length) return 'לא מצאתי משימה להעביר. ציין שם או מספר.';
    if(!when.due) return 'לא הבנתי לאיזה תאריך. נסה "...למחר", "...לשבוע הבא" או "...ליום חמישי".';
    if(cand.length>1) return botAskWhich(cand);
    const k=cand[0]; k.due=when.due; k.deferCount=(k.deferCount||0)+1; if(k.status==='waiting'){k.status='todo';k.waitingFor=false;} save();
    return `↪️ העברתי את "${k.title}" (${k.id}) ל${fmtDue(when.due)}.`;
  }
  // add (default)
  let body=text.replace(/^(תוסיף לי|תוסיף|הוסף לי|הוסף|תזכיר לי|תזכיר|תוסיפי|תכניס|צור|תרשום)\s*/,'').replace(/^(משימה|לי)\s*/,'');
  const p=parseNL(body);
  const k={ id:newId(), title:p.title||body, desc:'', area:p.area||'personal', project:'', created:t, due:p.due||'', time:p.time||'', prio:p.prio||'normal', status:'todo', progress:0, source:'whatsapp', notes:'', assignee:'', tags:[], recurring:false, freq:'', completedAt:'', nextAction:'', waitingFor:false, followUp:'', deferCount:0 };
  state.tasks.unshift(k); save();
  const bits=[]; if(k.due) bits.push(fmtDue(k.due)); if(k.time) bits.push(k.time); if(k.prio==='high') bits.push('דחוף'); if(AREAS[k.area]) bits.push(AREAS[k.area].label);
  return `✅ נוספה משימה ${k.id}: "${k.title}"${bits.length?'\n('+bits.join(' · ')+')':''}`;
}

/* ============================================================
   AI ASSISTANT — proactive, personal, rule-based "brain".
   Inspired by ClickUp's AI Brain, inverted: it already knows your
   data, surfaces only what matters, and never overwhelms. A real
   Claude call slots in here at the server stage.

function aiImportant(){ return focusTasks(); }
function aiProcrastinated(){
  const t=todayISO();
  return state.tasks.filter(x=>active(x)&&!isWaiting(x)&&((x.deferCount||0)>=2 || (x.created&&x.created<addDays(t,-14))))
    .sort((a,b)=>(b.deferCount||0)-(a.deferCount||0));
}
function aiStuck(){
  const t=todayISO();
  return { projs:(state.projects||[]).filter(p=>p.status==='active'&&!p.nextAction),
           waits:qWaiting().filter(x=>x.followUp&&x.followUp<t) };
}
function aiOverload(){
  const t=todayISO(); let worst={d:t,c:-1};
  for(let i=0;i<7;i++){ const d=addDays(t,i); const c=state.tasks.filter(x=>active(x)&&x.due===d).length; if(c>worst.c) worst={d,c}; }
  return worst;
}
function aiStalledGoals(){ return (state.goals||[]).filter(g=>!g.parent&&goalProgress(g)<25); }
function aiTopInsight(){
  const s=aiStuck(); const stuckN=s.projs.length+s.waits.length;
  if(stuckN) return {ic:'🚧',text:`${stuckN} דברים תקועים — פרויקט בלי פעולה הבאה או מעקב שעבר`};
  const ov=aiOverload(); if(ov.c>=6) return {ic:'⚖️',text:`${fmtDue(ov.d)} עמוס מדי: ${ov.c} משימות ביום אחד`};
  const pr=aiProcrastinated(); if(pr.length) return {ic:'🐌',text:`${pr.length} משימות שאתה דוחה כבר הרבה זמן`};
  const im=aiImportant(); if(im.length) return {ic:'🎯',text:`${im.length} משימות דורשות תשומת לב היום`};
  return null;
}
function aiPlanTomorrow(){
  const t=todayISO(), tm=addDays(t,1);
  const over=qOverdue(); const due=state.tasks.filter(x=>active(x)&&x.due===tm);
  const nexts=(state.projects||[]).filter(p=>p.status==='active'&&p.nextAction).slice(0,3);
  const habs=(state.habits||[]).length;
  let r='הצעה למחר:\n';
  if(over.length) r+=`\n⚠️ ${over.length} באיחור — כדאי להעביר קדימה:\n`+over.slice(0,3).map(x=>'• '+x.title).join('\n')+'\n';
  if(due.length) r+=`\n🗓️ כבר מתוכנן למחר (${due.length}):\n`+due.slice(0,4).map(x=>'• '+x.title+(x.time?' · '+x.time:'')).join('\n')+'\n';
  if(nexts.length) r+=`\n📁 פעולות הבאות בפרויקטים:\n`+nexts.map(p=>'• '+p.nextAction+' ('+p.name+')').join('\n')+'\n';
  if(habs) r+=`\n🔥 ${habs} הרגלים לסמן.`;
  if(!over.length&&!due.length&&!nexts.length) r+='\nמחר פנוי יחסית — הזדמנות טובה לקדם מטרה או לנוח.';

}
function askAI(raw){
  const text=raw.trim();
  if(/דוח|דוחה|נדחה|מתמהמה|תקוע.*זמן|procrast/.test(text)){
    const p=aiProcrastinated(); if(!p.length) return 'יפה — אין משימות שנתקעות אצלך הרבה זמן. 👏';
    return `מצאתי ${p.length} משימות שאתה דוחה:\n`+p.slice(0,6).map(x=>`• ${x.title}${x.deferCount?` (נדחתה ${x.deferCount}×)`:''}`).join('\n')+'\nהטיפ שלי: קח אחת עכשיו, גם אם קטן — או תחליט במודע לבטל.';
  }
  if(/תקוע|נתקע|חוסם|מחכה/.test(text)){
    const s=aiStuck(); if(!s.projs.length&&!s.waits.length) return 'שום דבר לא תקוע כרגע — הכל זז. 🚀';
    let r='מה שתקוע:\n';
    if(s.projs.length) r+='\n🚧 פרויקטים בלי פעולה הבאה:\n'+s.projs.map(p=>'• '+p.name).join('\n')+'\n';
    if(s.waits.length) r+='\n⏳ מעקבים שעבר זמנם:\n'+s.waits.map(w=>`• ${w.title}${w.assignee?' ('+w.assignee+')':''}`).join('\n');
    return r.trim();
  }
  if(/מעמיס|עומס|יותר מדי|לחוץ|הכי עסוק/.test(text)){
    const ov=aiOverload();
    const byArea={}; qOpen().forEach(x=>byArea[x.area]=(byArea[x.area]||0)+1);
    const top=Object.entries(byArea).sort((a,b)=>b[1]-a[1])[0];
    let r=`היום/השבוע: ${ov.c>=6?`⚖️ ${fmtDue(ov.d)} עמוס במיוחד עם ${ov.c} משימות ביום אחד. שקול לפזר.`:'העומס היומי מאוזן יחסית.'}`;
    if(top) r+=`\nהתחום שמושך הכי הרבה: ${(AREAS[top[0]]||{}).label||top[0]} (${top[1]} משימות פתוחות).`;
    return r;
  }
  if(/מחר|תכנן|תתכנן|תסדר לי/.test(text)) return aiPlanTomorrow();
  if(/פרויקט.*(לא התקדם|תקוע|נתקע|איטי)|איזה פרויקט/.test(text)){
    const ps=(state.projects||[]).filter(p=>p.status==='active').map(p=>({p,pct:projectStats(p).pct})).sort((a,b)=>a.pct-b.pct);
    if(!ps.length) return 'אין פרויקטים פעילים כרגע.';
    const w=ps[0]; return `הפרויקט שהכי צריך תשומת לב: "${w.p.name}" (${w.pct}% הושלם).${w.p.nextAction?`\nפעולה הבאה: ${w.p.nextAction}`:'\n⚠️ ואין לו פעולה הבאה מוגדרת.'}`;
  }
  if(/חשוב|הכי|היום|עכשיו|פוקוס/.test(text)){
    const im=aiImportant(); if(!im.length) return 'אין כרגע משימות דחופות. זמן טוב לקדם מטרה. 🎯';
    return `3 הדברים הכי חשובים עכשיו:\n`+im.slice(0,3).map((x,i)=>`${i+1}. ${x.title}${x.due?` (${fmtDue(x.due)})`:''}`).join('\n');
  }
  // fallback: quick briefing
  const im=aiImportant(), pr=aiProcrastinated(), s=aiStuck();
  return `הנה תמונת מצב מהירה:\n• ${im.length} דברים חשובים היום\n• ${qOverdue().length} באיחור\n• ${pr.length} שאתה דוחה\n• ${s.projs.length+s.waits.length} תקועים\nשאל אותי על כל אחד מהם, או "תכנן לי מחר".`;
}

function aiSend(){

          <div class="field"><label>אחראי / מחכה ל <span class="muted">(אופציונלי)</span></label><input id="f_assignee" value="${esc(d.assignee||'')}" placeholder="מי?"></div>
        </div>`:''}
        <div class="field"><label>הערה <span class="muted">(אופציונלי)</span></label><textarea id="f_notes" rows="2">${esc(d.notes||'')}</textarea></div>
      </div>
      <div class="modal-f">
        <button class="btn primary" onclick="saveTask(${isEdit})">${isEdit?'שמירה':'הוסף משימה'}</button>
        <button class="btn ghost" onclick="closeModal()">ביטול</button>
        ${isEdit?`<div class="spacer"></div><button class="btn ghost" style="color:var(--bad)" onclick="delTask('${editId}');closeModal()">מחיקה</button>`:''}
      </div>
    </div>
  </div>`;
  // prio chips
  document.querySelectorAll('#prioChips button').forEach(b=>b.onclick=()=>{
    draft.prio=b.dataset.p;
    document.querySelectorAll('#prioChips button').forEach(x=>x.className='');
    b.className='on '+PRIOS[b.dataset.p].cls;
  });
  const nlp=document.getElementById('nlp'); if(nlp) nlp.focus();
  const ft=document.getElementById('f_title'); if(ft) ft.focus();
}
function collectModal(isEdit){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const nlp=document.getElementById('nlp');
  const title = isEdit? g('f_title') : (nlp? nlp.value : draft.title);
  return {
    title:title.trim(), area:g('f_area')||draft.area, project:g('f_project').trim(),
    due:g('f_due'), time:g('f_time'), prio:draft.prio,
    notes:g('f_notes').trim(), assignee:g('f_assignee').trim(),
    status:g('f_status')||draft.status||'todo'
  };
}
function runParse(){
  const nlp=document.getElementById('nlp'); if(!nlp) return;
  const p=parseNL(nlp.value);
  draft=Object.assign(draft,p);
  nlp.value=p.title||nlp.value;
  // update fields
  if(p.area) document.getElementById('f_area').value=p.area;
  if(p.due) document.getElementById('f_due').value=p.due;
  if(p.time) document.getElementById('f_time').value=p.time;
  if(p.prio){ document.querySelectorAll('#prioChips button').forEach(x=>{x.className=x.dataset.p===p.prio?'on '+PRIOS[p.prio].cls:'';}); }
  if(p.project) document.getElementById('f_project').value=p.project;
  toast('פירקתי — בדוק ותקן לפני שמירה');
}
function saveTask(isEdit){
  const c=collectModal(isEdit);
  if(!c.title){ toast('צריך לפחות שם משימה'); return; }
  if(isEdit){
    const t=state.tasks.find(x=>x.id===editId);
    Object.assign(t,c);
    t.waitingFor = t.status==='waiting';
    if(c.status==='done' && !t.completedAt) t.completedAt=todayISO();
    toast('נשמר');
  }else{
    state.tasks.unshift({
      id:newId(), title:c.title, desc:'', area:c.area, project:c.project,
      created:todayISO(), due:c.due, time:c.time, prio:c.prio, status:'todo',
      progress:0, source:'manual', notes:c.notes, assignee:c.assignee, tags:[],
      recurring:false, freq:'', completedAt:'', nextAction:'', waitingFor:false, followUp:''
    });
    toast('משימה נוספה ✓');
  }
  save(); closeModal(); render();
}

/* ---------- natural language parse (Hebrew, heuristic) ---------- */
function parseNL(text){
  const out={};
  let s=' '+String(text).replace(/[,]/g,' ').replace(/\s+/g,' ').trim()+' ';
  const t=todayISO();
  // NOTE: \b word boundaries do NOT work around Hebrew letters in JS regex,
  // so we bound words with spaces on a padded string instead.
  const has=w=>new RegExp('(?:^| )'+w+'(?= |$)').test(s);
  const drop=w=>{ s=s.replace(new RegExp('(?:^| )'+w+'(?= |$)','g'),' '); };
  // time: "ב-10" / "ב10:30" / "בשעה 9"
  let m=s.match(/ ב[-]?(?:שעה )?(\d{1,2})(?::(\d{2}))?(?= |$)/);
  if(m){ out.time=pad(Math.min(23,+m[1]))+':'+(m[2]||'00'); s=s.replace(m[0],' '); }
  // relative days
  if(has('מחרתיים')){ out.due=addDays(t,2); drop('מחרתיים'); }
  else if(has('מחר')){ out.due=addDays(t,1); drop('מחר'); }
  else if(has('היום')){ out.due=t; drop('היום'); }
  else if(/ שבוע הבא(?= |$)/.test(s)||/ הבא(?= |$)/.test(s) && /שבוע/.test(s)){ out.due=addDays(t,7); s=s.replace(/ (ל)?שבוע הבא(?= |$)/,' '); }
  else {
    const dayMap={'ראשון':0,'שני':1,'שלישי':2,'רביעי':3,'חמישי':4,'שישי':5,'שבת':6};
    for(const [name,idx] of Object.entries(dayMap)){
      const re=new RegExp('(?:^| )(?:ביום |ליום |יום |ב|ל)?'+name+'(?= |$)');
      if(re.test(s)){
        const cur=parseISO(t).getDay(); let diff=(idx-cur+7)%7; if(diff===0) diff=7;
        out.due=addDays(t,diff); s=s.replace(re,' '); break;
      }
    }
  }
  // priority
  if(has('דחוף')||has('בדחיפות')||has('קריטי')||/ חשוב מאוד(?= |$)/.test(s)){ out.prio='high'; drop('דחוף');drop('בדחיפות');drop('קריטי'); s=s.replace(/ חשוב מאוד(?= |$)/,' '); }
  else if(has('חשוב')){ out.prio='medium'; drop('חשוב'); }
  // area by keyword (title still readable; used only to prefill the field)
  const areaKw={work:['עבודה','משרד','לקוח','פגישה','צהרון','גיוס'],family:['משפחה','ילדים','אישה'],health:['אימון','בריאות','רופא','כושר','ספורט','ריצה'],study:['לימודים','קורס','ללמוד','מבחן']};
  for(const [k,words] of Object.entries(areaKw)){ if(words.some(w=>s.includes(w))){ out.area=k; break; } }
  // clean the leftover into a title
  out.title=s.replace(/\s+/g,' ').replace(/^[ ]+|[ ]+$/g,'').trim();
  if(!out.title) out.title=String(text).trim();
  return out;
}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emptyState(ic,title,sub){ return `<div class="empty"><div class="em-ic">${ic}</div><div style="font-weight:700;color:var(--ink-soft)">${title}</div><div style="font-size:13px;margin-top:4px">${sub}</div></div>`; }
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900); }

function go(v){ currentView=v; closeNav(); render(); window.scrollTo(0,0); }

function attachViewEvents(v){
  if(v==='bot'){
    const box=document.getElementById('chatBox'); if(box) box.scrollTop=box.scrollHeight;
    const i=document.getElementById('botInput'); if(i) i.focus();
  }
  if(v==='assistant'){
    const box=document.getElementById('aiBox'); if(box) box.scrollTop=box.scrollHeight;
  }
  if(v==='tasks'){
    const s=document.getElementById('taskSearch');
    if(s) s.oninput=()=>{ taskFilter.search=s.value; const pos=s.selectionStart; renderTasksOnly(); const ns=document.getElementById('taskSearch'); if(ns){ns.focus();ns.setSelectionRange(pos,pos);} };
    document.querySelectorAll('#statusSeg button').forEach(b=>b.onclick=()=>{taskFilter.status=b.dataset.s;renderTasksOnly();});
    document.querySelectorAll('#areaSeg button').forEach(b=>b.onclick=()=>{taskFilter.area=b.dataset.a;renderTasksOnly();});
  }
}
function renderTasksOnly(){ document.getElementById('content').innerHTML=viewTasks(); attachViewEvents('tasks'); }

/* ---------- nav / theme ---------- */
function closeNav(){ document.getElementById('nav').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }
document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById('menuBtn').onclick=()=>{ document.getElementById('nav').classList.add('open'); document.getElementById('scrim').classList.add('show'); };
document.getElementById('scrim').onclick=closeNav;
document.getElementById('themeBtn').onclick=()=>{
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  const dark = cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.setAttribute('data-theme', dark?'light':'dark');
  state.theme=dark?'light':'dark'; save();
};
if(state.theme) document.documentElement.setAttribute('data-theme',state.theme);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.key==='n'||e.key==='ן') && !/(INPUT|TEXTAREA|SELECT)/.test(document.activeElement.tagName)){ e.preventDefault(); openQuickAdd(); }
});

// chart tooltip (per-mark hover)
(function(){
  const tip=document.getElementById('chartTip');
  function move(e){
    const pt=e.touches?e.touches[0]:e;
    const el=(e.target.closest?e.target.closest('[data-tip]'):null);
    if(el){ tip.textContent=el.getAttribute('data-tip'); tip.hidden=false; tip.style.left=pt.clientX+'px'; tip.style.top=pt.clientY+'px'; }
    else tip.hidden=true;
  }
  document.addEventListener('mousemove',move,{passive:true});
  document.addEventListener('scroll',()=>{tip.hidden=true;},{passive:true});
})();

render();
</script>
